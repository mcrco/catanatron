<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catan vs catanrl</title>
    <!-- Assets load by relative path: this directory works opened from a
         file or served from any host (add ?server=HOST:PORT to play). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="topbar">
      <a href="#" id="home">catanrl</a>
      <span id="room-title"></span>
      <span id="crypto-status" class="muted"></span>
    </header>

    <main id="lobby" hidden>
      <section class="hero">
        <h1>Play Catan against the bot</h1>
        <label class="name-field">Name <input id="lobby-name" maxlength="32" placeholder="Guest" /></label>
      </section>

      <p id="lobby-notice" class="notice" hidden></p>
      <section id="tables" class="tables"></section>

      <section class="panel" id="live-panel">
        <h2>In progress</h2>
        <ul id="live" class="live"></ul>
      </section>

      <section class="panel" id="rooms-panel">
        <h2>Rooms</h2>
        <table id="rooms">
          <thead>
            <tr><th>Room</th><th>Status</th><th>Players</th><th>Seats</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <button id="refresh">Refresh</button>
        <label><input type="checkbox" id="show-finished"> Show finished</label>
        <span id="hidden-count" class="muted"></span>
      </section>

      <section class="panel" id="create-panel">
        <h2>New room</h2>
        <form id="create">
          <label>Name <input name="name" maxlength="32" placeholder="optional" /></label>
          <label>Players
            <select name="num_players">
              <option>2</option><option>3</option><option selected>4</option>
              <option>5</option><option>6</option>
            </select>
          </label>
          <label>Map
            <select name="map_type">
              <option>BASE</option><option>TOURNAMENT</option><option>MINI</option>
            </select>
          </label>
          <label>Numbers
            <select name="number_placement">
              <option value="official_spiral">official spiral</option>
              <option value="random">random</option>
            </select>
          </label>
          <label>Points to win <input name="vps_to_win" type="number" min="3" max="30" value="10" /></label>
          <label>Discard limit <input name="discard_limit" type="number" min="3" max="100" value="7" /></label>
          <label>Seconds per decision <input name="timeout" type="number" min="1" value="120" /></label>
          <label class="wide">Explicit map (optional JSON: {"tiles": [...]})
            <textarea name="map" rows="3" placeholder='{"tiles": [{"coordinate": [0,0,0], "type": "land", "resource": "WOOD", "number": 6}, ...]}'></textarea>
          </label>
          <fieldset class="wide">
            <legend>Seats</legend>
            <div id="seat-specs"></div>
          </fieldset>
          <button type="submit" class="primary">Create room</button>
          <span id="create-error" class="error"></span>
        </form>
      </section>

      <footer>
        <details id="transcripts-box">
          <summary>Transcripts</summary>
          <ul id="transcripts"></ul>
        </details>
        <nav>
          <a href="https://github.com/mcrco/catanrl">catanrl</a>
          <a href="https://github.com/bcollazo/catanatron">catanatron</a>
        </nav>
      </footer>
    </main>

    <main id="room" hidden>
      <div id="stage">
        <div id="board-wrap">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="banner">
            <div id="prompt"></div>
            <div id="timer"><div id="timer-fill"></div></div>
          </div>
          <div id="dice"></div>
          <section id="seating"></section>
        </div>
        <div id="hand-bar">
          <section id="me"></section>
          <section id="actions"></section>
        </div>
      </div>
      <aside id="side">
        <section class="panel" id="players"></section>
        <section class="panel" id="bank"></section>
        <section class="panel log-panel">
          <h3>Log</h3>
          <ol id="log"></ol>
        </section>
        <details class="panel" id="fairness-box">
          <summary id="fairness-summary">Verification</summary>
          <div id="fairness"></div>
        </details>
      </aside>
      <div id="modal" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
